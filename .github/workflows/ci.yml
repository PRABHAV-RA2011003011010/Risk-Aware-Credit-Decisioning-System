name: Credit Fraud CI/CD

on:
  push:
    paths:
      - "models/**"   # Trigger only if models change
      - "src/**"      # Or include app code changes too
      - "tests/**"    # Run tests if test files change

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: credit_fraud_detection
          environment-file: environment.yml
          auto-activate-base: false

      - name: Install Dependencies
        shell: bash -l {0}
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        shell: bash -l {0}
        run: pytest tests/ --maxfail=1 --disable-warnings -q

      - name: Deploy to Hugging Face Spaces
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci-bot@example.com"
          git config --global user.name "CI Bot"
          git push https://huggingface.co/spaces/<your-username>/<your-space> main
